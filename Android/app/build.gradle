plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def releaseKeystore = rootProject.file('keystore/ledger.jks')

android {
    namespace 'com.cost.ledger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cost.ledger'
        minSdk 24
        // Deliberately 34: Android 15+ forces edge-to-edge for apps targeting
        // 35, which would slide the sticky top bar under the status bar. Bump
        // this only together with window-inset handling in MainActivity.
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // arm64-v8a covers every current phone; x86_64 keeps emulators usable.
        // (armeabi-v7a would only be available with Python 3.11 or older, and
        //  that would also force a matching host interpreter for the build.)
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword project.findProperty('LEDGER_STORE_PASSWORD') ?: 'ledger2026'
                keyAlias project.findProperty('LEDGER_KEY_ALIAS') ?: 'ledger'
                keyPassword project.findProperty('LEDGER_KEY_PASSWORD') ?: 'ledger2026'
            }
        }
    }

    buildTypes {
        debug {
            // Same applicationId so a debug build can replace the release one,
            // which keeps the on-device database in place while iterating.
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        // App-side interpreter bundled into the APK. It must match the
        // buildPython version below, which is the interpreter used on this
        // machine to pre-compile the sources.
        version = '3.14'
        buildPython project.findProperty('LEDGER_BUILD_PYTHON') ?: 'python'
    }
}
