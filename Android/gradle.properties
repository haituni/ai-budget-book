org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=false
android.nonTransitiveRClass=true

# 本工程所在路径含中文（D:\硕士\cost）。AGP 默认会直接拒绝这种路径，
# 实测构建可用，所以显式关掉这个检查。
android.overridePathCheck=true

# Host interpreter Chaquopy uses to (re)build the bundled Python. The backend
# only needs the standard library, so no pip requirements are installed.
LEDGER_BUILD_PYTHON=D:\\Study\\python3.14.7\\python.exe

# Release signing (personal build; change these before publishing anywhere).
LEDGER_STORE_PASSWORD=ledger2026
LEDGER_KEY_ALIAS=ledger
LEDGER_KEY_PASSWORD=ledger2026
